# Corre las pruebas automáticas de la base de datos en cada cambio.
name: Pruebas de base de datos

on:
  push:
    paths: ['supabase/**', '.github/workflows/pruebas.yml']
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Correr pruebas
        run: |
          bash supabase/tests/correr_pruebas.sh | tee salida.txt
          grep -q "✅ Todas las pruebas pasaron" salida.txt
          grep -q "✅ Pruebas de concurrencia pasaron" salida.txt
          ! grep -q "FALLÓ\|✘" salida.txt
