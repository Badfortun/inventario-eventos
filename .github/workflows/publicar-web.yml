
# Publica la carpeta web/ en GitHub Pages.
name: Publicar app web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publicar-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Revisar configuración de Supabase
        shell: bash
        run: |
          if grep -Eq 'TU-PROYECTO|PEGA-AQUI' web/config.js; then
            echo "::error::web/config.js todavía contiene valores de ejemplo."
            exit 1
          fi

          if grep -Eq 'service_role|sb_secret_' web/config.js; then
            echo "::error::No publiques claves secretas en config.js."
            exit 1
          fi

          echo "Configuración revisada."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: despliegue
        uses: actions/deploy-pages@v4
