# Publica la carpeta web/ en GitHub Pages cada vez que se sube un cambio.
name: Publicar app web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar configuración de Supabase
        run: |
          # Solo se revisan las líneas con valores (no los comentarios)
          URL_LINEA=$(grep -E "^\s*SUPABASE_URL\s*:" web/config.js || true)
          KEY_LINEA=$(grep -E "^\s*SUPABASE_ANON_KEY\s*:" web/config.js || true)
          if echo "$URL_LINEA $KEY_LINEA" | grep -Eq 'TU-PROYECTO|PEGA-AQUI'; then
            echo "::error::web/config.js todavía tiene los valores de ejemplo."
            exit 1
          fi
          if echo "$KEY_LINEA" | grep -Eqi 'sb_secret_|service_role'; then
            echo "::error::La clave en config.js es SECRETA. Usa la 'publishable' o 'anon public'."
            exit 1
          fi
          echo "Configuración revisada: $URL_LINEA"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
