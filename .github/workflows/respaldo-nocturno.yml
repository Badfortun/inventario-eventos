# Respaldo completo de la base de datos cada noche.
# El archivo se CIFRA con una contraseña antes de guardarse (en un repositorio
# público, otras personas podrían descargar los archivos de las tareas).
# Requiere los secrets: SUPABASE_DB_URL (cadena "Session pooler") y CLAVE_RESPALDO.
# Se conservan 30 días en Actions → (esta tarea) → Artifacts.
name: Respaldo nocturno

on:
  schedule:
    - cron: '7 9 * * *'   # todos los días, 3:07 a.m. hora del centro de México
  workflow_dispatch:

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Exportar y cifrar
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.CLAVE_RESPALDO }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$CLAVE" ]; then echo "::error::Faltan SUPABASE_DB_URL y/o CLAVE_RESPALDO"; exit 1; fi
          fecha=$(TZ=America/Mexico_City date +%Y-%m-%d_%H%M)
          mkdir respaldo
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -f respaldo/public.sql
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --data-only --table=auth.users --table=auth.identities -f respaldo/usuarios.sql
          /usr/lib/postgresql/17/bin/psql "$DB_URL" -At -c "select count(*) from public.movimientos" > respaldo/total_movimientos.txt
          tar czf - respaldo | gpg --batch --yes --pinentry-mode loopback --passphrase "$CLAVE" --symmetric --cipher-algo AES256 -o "respaldo_$fecha.tar.gz.gpg"
          echo "ARCHIVO=respaldo_$fecha.tar.gz.gpg" >> "$GITHUB_ENV"
          ls -la respaldo "respaldo_$fecha.tar.gz.gpg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVO }}
          path: ${{ env.ARCHIVO }}
          retention-days: 30
